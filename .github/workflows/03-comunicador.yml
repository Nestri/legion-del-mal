# This is a basic workflow to help you get started with Actions

name: Comunicador de la Legión

# Controls when the workflow will run
on:
  workflow_dispatch:
    inputs:
      villano:
        description: '¿Que villano envia el mensaje?'
        required: true
        type: choice
        options:
          - "Dr. Maligno"
          - "Dama Venenosa"
          - "El Hombre de Hielo"
          - "El Hombre de Fuego" 
      mensaje:
        description: 'Mensaje a transmitir'
        required: true
        default: 'Mensaje secreto de la Legión del Mal'
      prioridad:
        description: 'Nivel de prioridad'
        required: true
        type: choice
        options:
          - Normal
          - Alta
          - Urgente


jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: "Imprimir inputs"
        run: |
          echo "-----------------------------------------"
          echo "Villano: ${{ github.event.inputs.villano }}"
          echo "Mensaje: ${{ github.event.inputs.mensaje }}"
          echo "Prioridad: ${{ github.event.inputs.prioridad }}"
